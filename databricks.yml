bundle:
  name: genie-loss-ratio-coworker

# Every Databricks resource is declared as code in resources/*.yml:
#   resources/lrc_lakebase.yml  Lakebase Postgres instance (operational store)
#   resources/lrc_pipeline.yml  Lakeflow Spark Declarative Pipeline (Auto Loader → bronze → silver → Gen AI DQ → gold)
#   resources/lrc_jobs.yml      Lakeflow Jobs: setup, daily watch, and the end-to-end daily run
#   resources/lrc_app.yml       Action Desk Databricks App on Lakebase
include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog to install into
  schema:
    default: loss_ratio_coworker
  warehouse_id:
    description: Serverless SQL warehouse for the Genie Agent and dashboard
  genie_space_id:
    description: Space id printed by deploy/genie_agent.py
    default: ""
  secret_scope:
    default: loss_ratio_coworker
  lakebase_instance:
    description: Lakebase Postgres instance for actions, team status and pricing transactions
    default: lrc-lakebase
  lakebase_database:
    default: lrc_ops
  llm_endpoint:
    description: Foundation Model API chat endpoint used by ai_query in the pipeline's data-quality explanations
    default: databricks-meta-llama-3-3-70b-instruct
  ai_lookback_days:
    description: Report days covered by the Gen AI data-quality checks (bounds token cost)
    default: "14"

targets:
  dev:
    mode: development
    default: true
